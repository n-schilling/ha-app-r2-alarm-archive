name: R2 Alarm Archive
version: "0.8.1"
slug: r2_alarm_archive
description: Archives the alarm log and snapshots of your Home Assistant alarm panel in a Cloudflare R2 bucket
url: https://github.com/n-schilling/ha-app-r2-alarm-archive
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
panel_icon: mdi:archive-lock-outline
panel_title: Alarm Archive
services:
  - mqtt:want
map:
  - type: addon_config
    read_only: false
options:
  account_id: ""
  bucket: ""
  jurisdiction: default
  access_key_id: ""
  secret_access_key: ""
  api_token: ""
  free_tier_guard: true
  log_entity: ""
  alarm_panel: ""
  snapshot_states:
    - armed_home
    - armed_away
    - armed_night
    - armed_vacation
    - armed_custom_bypass
    - triggered
    - disarmed
  snapshot_entities: []
  snapshot_all_entities: false
  cameras: []
  camera_states:
    - triggered
  camera_pictures: 3
  camera_interval: 10
  r2_check_interval: 15
  retention_log: unlimited
  retention_snapshots: "365"
  retention_summaries: unlimited
  lock_log: "off"
  lock_snapshots: "off"
  lock_summaries: "off"
  discovery_prefix: homeassistant
  log_level: info
schema:
  account_id: str
  bucket: str
  jurisdiction: list(default|eu)
  access_key_id: str
  secret_access_key: password
  api_token: password?
  free_tier_guard: bool
  log_entity: str
  alarm_panel: str?
  snapshot_states:
    - list(armed_home|armed_away|armed_night|armed_vacation|armed_custom_bypass|arming|pending|triggered|disarmed)
  snapshot_entities:
    - str
  snapshot_all_entities: bool
  cameras:
    - str
  camera_states:
    - list(armed_home|armed_away|armed_night|armed_vacation|armed_custom_bypass|arming|pending|triggered|disarmed)
  camera_pictures: int(1,10)
  camera_interval: int(1,60)
  r2_check_interval: int(1,1440)
  retention_log: match(^(unlimited|[1-9][0-9]{0,4})$)
  retention_snapshots: match(^(unlimited|[1-9][0-9]{0,4})$)
  retention_summaries: match(^(unlimited|[1-9][0-9]{0,4})$)
  lock_log: match(^(off|indefinite|[1-9][0-9]{0,4})$)
  lock_snapshots: match(^(off|indefinite|[1-9][0-9]{0,4})$)
  lock_summaries: match(^(off|indefinite|[1-9][0-9]{0,4})$)
  discovery_prefix: match(^[A-Za-z0-9_/-]+$)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(info|warning|error)
